openapi: 3.0.3
info:
  title: 实验室设备管理系统 API
  version: 1.0.0
  description: 设备资产登记、借用归还、维护保养、使用预约与状态看板接口。
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Equipment
  - name: Borrow
  - name: Maintenance
  - name: Reservation
  - name: Category
  - name: Dashboard
  - name: Audit
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 登录并获取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { description: 登录成功 }
  /auth/me:
    get:
      tags: [Auth]
      summary: 当前登录用户信息
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /users:
    get:
      tags: [Auth]
      summary: 分页查询用户
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: 成功 }
  /equipment:
    get:
      tags: [Equipment]
      summary: 分页查询设备
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Equipment]
      summary: 登记设备
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /equipment/{id}:
    get:
      tags: [Equipment]
      summary: 设备详情
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    put:
      tags: [Equipment]
      summary: 更新设备
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /equipment/{id}/status:
    patch:
      tags: [Equipment]
      summary: 修改设备资产状态（报废）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /equipment/{id}/owner:
    patch:
      tags: [Equipment]
      summary: 转移责任人
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /borrows:
    get:
      tags: [Borrow]
      summary: 分页查询借用记录
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Borrow]
      summary: 提交借用申请
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /borrows/{id}/approve:
    post:
      tags: [Borrow]
      summary: 审批通过
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /borrows/{id}/reject:
    post:
      tags: [Borrow]
      summary: 驳回申请
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /borrows/{id}/return:
    post:
      tags: [Borrow]
      summary: 确认归还
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /borrows/{id}/renewals:
    get:
      tags: [Borrow]
      summary: 查询单笔借用的续借历史
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Borrow]
      summary: 借用人提交续借申请（须在预计归还日前，延长 1-7 天）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extendDays]
              properties:
                extendDays: { type: integer, minimum: 1, maximum: 7 }
                reason: { type: string, maxLength: 512 }
      responses:
        '200': { description: 成功 }
        '409': { description: 已逾期/已归还/已有待审批续借/已到归还日 }
  /renewals:
    get:
      tags: [Borrow]
      summary: 分页查询续借申请（可按 status、borrow_id 筛选）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [Pending, Approved, Rejected, Expired] } }
        - { name: borrow_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: 成功 }
  /renewals/{id}/approve:
    post:
      tags: [Borrow]
      summary: 批准续借（更新预计归还日期，保留原到期时间；并发批准只生效一次）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
        '409': { description: 申请已被处理或借用已到期 }
  /renewals/{id}/reject:
    post:
      tags: [Borrow]
      summary: 驳回续借申请（不改变原借用记录）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 512 }
      responses:
        '200': { description: 成功 }
  /maintenance:
    get:
      tags: [Maintenance]
      summary: 分页查询维护记录
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Maintenance]
      summary: 创建维护记录
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /maintenance/stats:
    get:
      tags: [Maintenance]
      summary: 维护统计
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /reservations:
    get:
      tags: [Reservation]
      summary: 分页查询预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Reservation]
      summary: 创建预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /reservations/{id}/approve:
    post:
      tags: [Reservation]
      summary: 审批通过预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /reservations/{id}/reject:
    post:
      tags: [Reservation]
      summary: 驳回预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /reservations/{id}/cancel:
    post:
      tags: [Reservation]
      summary: 取消预约
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /categories:
    get:
      tags: [Category]
      summary: 查询分类树
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
    post:
      tags: [Category]
      summary: 新增分类
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /dashboard/stats:
    get:
      tags: [Dashboard]
      summary: 仪表盘统计
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
  /audit-logs:
    get:
      tags: [Audit]
      summary: 分页查询审计日志
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 成功 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
